name: Android checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Storage, reminders, lint, and development APK
        working-directory: android
        run: bash gradlew --no-daemon testReleaseUnitTest lintRelease assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-check-reports
          path: |
            android/app/build/reports/tests/testReleaseUnitTest
            android/app/build/reports/lint-results-release.*
      # Not a public release: this APK has no registered publisher OAuth configuration.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-unregistered-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
